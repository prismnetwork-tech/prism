name: package validation

on:
  pull_request:
    paths:
      - ".github/workflows/package-validation.yml"
      - "agentkit/**"
      - "mcp/**"
      - "python-sdk/**"
      - "scripts/canary/**"
      - "scripts/validate-mcp-package.mjs"
      - "scripts/validate-python-packages.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/package-validation.yml"
      - "agentkit/**"
      - "mcp/**"
      - "python-sdk/**"
      - "scripts/canary/**"
      - "scripts/validate-mcp-package.mjs"
      - "scripts/validate-python-packages.py"
  workflow_dispatch:

concurrency:
  group: package-validation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --disable-pip-version-check build==1.3.0
      - name: Build wheels
        run: |
          python -m build --wheel python-sdk
          python -m build --wheel agentkit
      - name: Install local wheels
        run: python -m pip install python-sdk/dist/*.whl agentkit/dist/*.whl
      - run: python -m pip check
      - run: python scripts/validate-python-packages.py

  mcp:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - run: node scripts/validate-mcp-package.mjs
      - name: Install MCP publisher
        run: |
          archive="$RUNNER_TEMP/mcp-publisher.tar.gz"
          curl --fail --location --silent --show-error \
            https://github.com/modelcontextprotocol/registry/releases/download/v1.8.0/mcp-publisher_linux_amd64.tar.gz \
            --output "$archive"
          printf '%s  %s\n' \
            1370446bbe74d562608e8005a6ccce02d146a661fbd78674e11cc70b9618d6cf \
            "$archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP" mcp-publisher
      - run: '"$RUNNER_TEMP/mcp-publisher" validate mcp/server.json'

  canary:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - run: node --test scripts/canary/config.test.mjs
      - run: node scripts/canary/canary.mjs --dry-run
