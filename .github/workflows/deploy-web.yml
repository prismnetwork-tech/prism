name: deploy web

# The site is published as a container image, not built from this repository:
# the Render service pulls a pinned tag and `autoDeploy` is off. So a deploy is
# three things, not one, and asking Render to deploy without doing the first two
# redeploys whatever tag is already pinned while reporting success. That is a
# green check over an unchanged site, which is worse than a red one.
#
# The runner builds amd64 natively, which is what Render runs and what an arm64
# laptop can only reach through emulation.

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: deploy-web
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      # NEXT_PUBLIC_* values are inlined at build time, so the image is only
      # correct if they match what the service runs with. They are read from the
      # service itself rather than duplicated into secrets, because a second
      # copy is a second thing to forget.
      - name: Read the public build settings off the service
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          SERVICE_ID: ${{ secrets.RENDER_WEB_SERVICE_ID }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            "https://api.render.com/v1/services/$SERVICE_ID/env-vars?limit=100" \
            | jq -r '.[].envVar | select(.key | startswith("NEXT_PUBLIC_")) | "\(.key)=\(.value)"' \
            > public-build-args.env
          if [ ! -s public-build-args.env ]; then
            printf 'the service reports no NEXT_PUBLIC_* settings\n' >&2
            exit 1
          fi
          # The values are not secret, the file is only a build input, but the
          # log is public so only the names are printed.
          cut -d= -f1 public-build-args.env

      # No buildx: the runner is already amd64, so there is nothing to emulate,
      # and its container driver builds somewhere the plain `docker push` below
      # cannot authenticate from.
      - name: Sign in to the image registry
        env:
          REGISTRY_USER: ${{ secrets.PRISM_REGISTRY_USER }}
          REGISTRY_PASS: ${{ secrets.PRISM_REGISTRY_PASS }}
        run: |
          set -euo pipefail
          printf '%s' "$REGISTRY_PASS" \
            | docker login registry.prismnetwork.tech -u "$REGISTRY_USER" --password-stdin

      - name: Build and publish the site image
        id: image
        run: |
          set -euo pipefail
          tag="registry.prismnetwork.tech/prism-web:${GITHUB_SHA::7}"
          args=()
          while IFS= read -r line; do args+=(--build-arg "$line"); done < public-build-args.env
          docker build --platform linux/amd64 -f deploy/Dockerfile.web "${args[@]}" -t "$tag" .
          docker push "$tag"
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"

      # Pinning the tag is what makes the deploy carry this commit. Without it
      # the request below redeploys the previous image.
      - name: Pin the service to it
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          SERVICE_ID: ${{ secrets.RENDER_WEB_SERVICE_ID }}
          OWNER_ID: ${{ secrets.RENDER_OWNER_ID }}
          TAG: ${{ steps.image.outputs.tag }}
        run: |
          set -euo pipefail
          pinned=$(curl --fail --silent --show-error -X PATCH \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$(jq -nc --arg owner "$OWNER_ID" --arg path "$TAG" \
                  '{image: {ownerId: $owner, imagePath: $path}}')" \
            "https://api.render.com/v1/services/$SERVICE_ID" | jq -r '.imagePath')
          if [ "$pinned" != "$TAG" ]; then
            printf 'the service is pinned to %s, not %s\n' "$pinned" "$TAG" >&2
            exit 1
          fi
          printf 'pinned %s\n' "$pinned"

      - name: Request a deploy of this commit
        id: request
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          SERVICE_ID: ${{ secrets.RENDER_WEB_SERVICE_ID }}
        run: |
          set -euo pipefail
          response=$(curl --fail --silent --show-error -X POST \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{"clearCache":"do_not_clear"}' \
            "https://api.render.com/v1/services/$SERVICE_ID/deploys")
          deploy=$(printf '%s' "$response" | jq -r '.id')
          if [ -z "$deploy" ] || [ "$deploy" = "null" ]; then
            printf 'Render did not return a deploy id: %s\n' "$response" >&2
            exit 1
          fi
          printf 'deploy=%s\n' "$deploy" >> "$GITHUB_OUTPUT"
          printf 'requested %s\n' "$deploy"

      - name: Wait for it to go live
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          SERVICE_ID: ${{ secrets.RENDER_WEB_SERVICE_ID }}
          DEPLOY_ID: ${{ steps.request.outputs.deploy }}
        run: |
          set -euo pipefail
          # A deploy that is requested but never succeeds is the failure this
          # workflow exists to surface, so the job only passes once it is live.
          for _ in $(seq 1 100); do
            status=$(curl --fail --silent --show-error \
              -H "Authorization: Bearer $RENDER_API_KEY" \
              "https://api.render.com/v1/services/$SERVICE_ID/deploys/$DEPLOY_ID" \
              | jq -r '.status')
            printf '%s\n' "$status"
            case "$status" in
              live) exit 0 ;;
              build_failed|update_failed|canceled|pre_deploy_failed) exit 1 ;;
            esac
            sleep 15
          done
          printf 'deploy %s did not finish in time\n' "$DEPLOY_ID" >&2
          exit 1
