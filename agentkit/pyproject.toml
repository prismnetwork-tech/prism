[project]
name = "prism-agentkit"
version = "0.1.2"
description = "Coinbase AgentKit action provider for renting real NVIDIA GPUs on Prism Network."
readme = "README.md"
requires-python = ">=3.10,<4.0"
license = { text = "Apache-2.0" }
keywords = ["agentkit", "coinbase", "gpu", "prism", "langchain", "agent", "compute"]
dependencies = [
    "coinbase-agentkit>=0.7,<0.8",
    "prismnetwork>=0.1.0",
    "pydantic>=2",
    "solana>=0.36.6,<0.40",
]

[project.urls]
Homepage = "https://prismnetwork.tech"
Repository = "https://github.com/winter0x/prism"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["prism_agentkit"]
